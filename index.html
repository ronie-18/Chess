<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Chess Game</h1>

        <div class="game-container">
            <div class="board-coordinates">
                <div class="chessboard" id="chessboard">
                    <!-- Board will be generated by JavaScript -->
                </div>
                <div class="file-labels">
                    <span>a</span>
                    <span>b</span>
                    <span>c</span>
                    <span>d</span>
                    <span>e</span>
                    <span>f</span>
                    <span>g</span>
                    <span>h</span>
                </div>
                <div class="rank-labels">
                    <span>8</span>
                    <span>7</span>
                    <span>6</span>
                    <span>5</span>
                    <span>4</span>
                    <span>3</span>
                    <span>2</span>
                    <span>1</span>
                </div>
            </div>

            <div class="game-info">
                <div class="timer-section">
                    <h2>Game Timer</h2>
                    <div class="timers">
                        <div class="player-timer" id="white-timer">
                            <span class="timer-label">White</span>
                            <span class="timer-value" id="white-time">5:00</span>
                        </div>
                        <div class="player-timer" id="black-timer">
                            <span class="timer-label">Black</span>
                            <span class="timer-value" id="black-time">5:00</span>
                        </div>
                    </div>
                </div>

                <div class="status-section">
                    <h2>Game Status</h2>
                    <div class="current-player">
                        <div class="player-indicator" id="player-indicator"></div>
                        <p id="player-text">White's turn</p>
                    </div>
                    <p id="game-status"></p>
                </div>

                <div class="captured-section">
                    <h2>Captured Pieces</h2>
                    <div class="captured-pieces" id="white-captured"></div>
                    <div class="captured-pieces" id="black-captured"></div>
                </div>

                <div class="history-section">
                    <h2>Move History</h2>
                    <div class="move-history" id="move-history">
                        <p class="no-moves">No moves yet</p>
                    </div>
                </div>

                <div class="game-controls">
                    <button id="start-timer-button">Start Timer</button>
                    <button id="undo-button">Undo</button>
                    <button id="reset-button">Reset</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Promotion Modal -->
    <div class="promotion-modal" id="promotion-modal">
        <div class="promotion-content">
            <h2>Choose Promotion</h2>
            <div class="promotion-options" id="promotion-options">
                <!-- Pieces will be added by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Settings Button and Modal -->
    <button class="settings-button" id="settings-button">⚙️</button>
    <div class="settings-modal" id="settings-modal">
        <div class="settings-content">
            <div class="settings-header">
                <h2>Game Settings</h2>
                <button class="close-settings" id="close-settings">×</button>
            </div>
            <div class="setting-item">
                <label for="time-control">Time Control</label>
                <select id="time-control">
                    <option value="0">No Time Limit</option>
                    <option value="5" selected>5 Minutes</option>
                    <option value="10">10 Minutes</option>
                    <option value="15">15 Minutes</option> 
                    <option value="30">30 Minutes</option>
                </select>
            </div>
            <div class="setting-item">
                <label for="board-theme">Board Theme</label>
                <select id="board-theme">
                    <option value="classic" selected>Classic (Brown)</option>
                    <option value="blue">Blue</option>
                    <option value="green">Green</option>
                    <option value="gray">Gray</option>
                </select>
            </div>
            <button class="save-settings" id="save-settings">Save Settings</button>
        </div>
    </div>

    <script src="chess.js"></script>
</body>

</html>
